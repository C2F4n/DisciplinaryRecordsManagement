spring.application.name=DisciplinaryRecordsManagement
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/disciplinary_records?connectionTimeZone=${app.policy.time-zone}}
spring.datasource.username=${DB_USER:discipline_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:18643}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=${app.roster.max-file-size}
spring.servlet.multipart.max-request-size=${APP_ROSTER_MAX_REQUEST_SIZE:3MB}
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
logging.level.org.example.disciplinaryrecordsmanagement=INFO
logging.pattern.level=%5p [request:%X{requestId:-}]
logging.file.name=${APP_LOG_FILE:logs/disciplinary.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
app.bootstrap.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.password=${APP_ADMIN_PASSWORD:}

app.policy.time-zone=${APP_TIME_ZONE:Asia/Shanghai}
app.policy.pending-days=${APP_PENDING_DAYS:4}
app.policy.edit-days=${APP_EDIT_DAYS:2}
app.policy.enrollment-years=${APP_ENROLLMENT_YEARS:4}
app.policy.pending-cleanup-delay=${APP_PENDING_CLEANUP_DELAY:PT30M}
# Spring Boot reads .properties as ISO-8859-1. Use APP_DEFAULT_DISPOSITION to override the Chinese default.
app.policy.default-disposition=${APP_DEFAULT_DISPOSITION:\u9662\u5185\u901a\u62a5\u6279\u8bc4\uff0c\u63d0\u4ea4\u4e66\u9762\u7406\u8bba\u5b66\u4e60}
app.policy.login-window=${APP_LOGIN_WINDOW:PT1M}
app.policy.login-attempts-per-ip=${APP_LOGIN_ATTEMPTS_PER_IP:60}
app.policy.login-max-tracked-sources=${APP_LOGIN_MAX_TRACKED_SOURCES:4096}

app.report.enabled=${APP_REPORT_ENABLED:true}
app.report.generation-time=${APP_REPORT_GENERATION_TIME:18:00}
app.report.poll-cron=${APP_REPORT_POLL_CRON:0 * * * * *}
app.report.max-months-per-run=${APP_REPORT_MAX_MONTHS_PER_RUN:12}

app.export.max-rows=${APP_EXPORT_MAX_ROWS:10000}
app.notice.pending-cron=${APP_NOTICE_PENDING_CRON:0 */5 * * * *}
app.notice.email.enabled=${APP_NOTICE_EMAIL_ENABLED:false}
app.notice.email.from=${SMTP_FROM:}
app.notice.email.key-file=${SMTP_SETTINGS_KEY_FILE:.smtp-settings.key}
app.notice.email.poll-delay=${APP_NOTICE_EMAIL_POLL_DELAY:PT15S}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.ssl.enable]=${SMTP_SSL:false}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.roster.max-rows=${APP_ROSTER_MAX_ROWS:500}
app.roster.max-file-size=${APP_ROSTER_MAX_FILE_SIZE:2MB}

app.retention.enabled=${APP_RETENTION_ENABLED:false}
app.retention.years=${APP_RETENTION_YEARS:1}
app.retention.cron=${APP_RETENTION_CRON:0 25 2 * * *}
app.retention.max-weeks-per-run=${APP_RETENTION_MAX_WEEKS_PER_RUN:26}
